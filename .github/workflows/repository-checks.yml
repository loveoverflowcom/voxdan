name: Repository checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documents-and-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate documents, fixtures and agent skills
        run: python3 scripts/check_repository.py
      - name: Test repository checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check independent Script IR goldens
        run: python3 scripts/reference_script_ir.py
  script-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select pinned Rust toolchain
        run: rustup toolchain install 1.87.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo +1.87.0 fmt --all -- --check
      - name: Lint Script IR
        run: cargo +1.87.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Script IR contracts
        run: cargo +1.87.0 test --workspace --locked
