[package]
name = "cantos-studio"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[dependencies]
cantos-api = { path = "../../contracts/api" }
serde_json = "=1.0.145"
serde = "=1.0.228"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "=0.7.8", features = ["csr"] }
gloo-net = { version = "=0.6.0", features = ["http"] }
web-sys = { version = "=0.3.77", features = ["Crypto", "Window"] }
